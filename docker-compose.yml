# Sobe PostgreSQL + 2 réplicas da API atrás de um balanceador (nginx),
# demonstrando que a API é stateless e escala horizontalmente.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raizes
      POSTGRES_USER: raizes
      POSTGRES_PASSWORD: raizes
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raizes"]
      interval: 5s
      retries: 10
    volumes: [dbdata:/var/lib/postgresql/data]

  api:
    build: .
    deploy:
      replicas: 2
    environment:
      DB_URL: jdbc:postgresql://db:5432/raizes
      DB_USER: raizes
      DB_PASSWORD: raizes
      JWT_SEGREDO: ${JWT_SEGREDO:-troque-este-segredo-em-producao-com-32-bytes-ou-mais}
      WEBHOOK_SEGREDO: ${WEBHOOK_SEGREDO:-segredo-webhook-dev}
    depends_on:
      db:
        condition: service_healthy

  lb:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api]

volumes:
  dbdata:
